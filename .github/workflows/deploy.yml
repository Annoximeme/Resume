name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits for the running one instead of cancelling it, so the
# live site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Check colour contrast (WCAG AA)
        run: npm run contrast

      # Refreshes src/content/github.json. The script never fails the build:
      # if the API is unreachable it keeps the committed snapshot.
      - name: Refresh GitHub activity
        run: npm run github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # Project site served from /<repo>/. For a custom domain or a
          # <user>.github.io repo, change this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install Chromium for the PDF and the audit
        run: npx playwright install --with-deps chromium

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173/${{ github.event.repository.name }}/ -t 60000

      # Renders the print stylesheet, so the download can never drift from the
      # page. Failing here should not block a deploy of the site itself.
      - name: Generate resume.pdf
        continue-on-error: true
        run: npm run pdf -- http://127.0.0.1:4173/${{ github.event.repository.name }}/

      # Writes dist/metrics.json. If it fails the page simply shows no scores,
      # which is the right outcome: better absent than invented.
      - name: Audit with Lighthouse
        continue-on-error: true
        run: node scripts/lighthouse.mjs http://127.0.0.1:4173/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
