name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits for the running one instead of cancelling it, so the
# live site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Project site served from /<repo>/. For a custom domain or a
          # <user>.github.io repo, change this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/

      # Requires Pages to be enabled on the repo first:
      # Settings -> Pages -> Source -> GitHub Actions. This step cannot turn it
      # on itself — creating a Pages site needs repo-admin rights, which the
      # workflow's GITHUB_TOKEN does not have.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
