<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These tags are what search engines and social previews read before any
      JavaScript runs, so keep them in sync with src/content/resume.ts.
      (main.tsx re-applies title/description at runtime as a safety net.)
    -->
    <title>Gianni Goossens — Front-End Developer</title>
    <meta
      name="description"
      content="Front-end developer building fast, accessible web interfaces with React and TypeScript. Portfolio, experience and contact details."
    />
    <link rel="canonical" href="https://annoximeme.github.io/Resume/" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Gianni Goossens — Front-End Developer" />
    <meta
      property="og:description"
      content="Front-end developer building fast, accessible web interfaces with React and TypeScript."
    />
    <meta property="og:url" content="https://annoximeme.github.io/Resume/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Absolute URLs: crawlers do not resolve these against the page. -->
    <meta property="og:image" content="https://annoximeme.github.io/Resume/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Gianni Goossens, Front-End Developer, Belgium"
    />
    <meta name="twitter:image" content="https://annoximeme.github.io/Resume/og.png" />

    <meta name="theme-color" content="#fcfbf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />

    <!-- Vite rewrites this to include `base` at build time. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts are render-blocking for the wordmark, so fetch them alongside
         the CSS rather than after it. crossorigin is required on font
         preloads even same-origin, or the fetch is made twice. -->
    <link
      rel="preload"
      href="/fonts/InstrumentSans-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/BricolageGrotesque-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gianni Goossens",
        "jobTitle": "Front-End Developer",
        "url": "https://annoximeme.github.io/Resume/",
        "sameAs": ["https://github.com/Annoximeme"]
      }
    </script>

    <script>
      // Applies the stored theme before first paint, so a dark-theme visitor
      // never sees a white flash. Kept inline and tiny on purpose.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* storage unavailable; the CSS media query handles it */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
